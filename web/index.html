<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>fuxi 知识库</title>
<style>
:root { --bg: #f5f5f0; --card: #fff; --ink: #2c2c2c; --dim: #8a8a8a; --accent: #b3541e; --line: #e3e0d8; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; background: var(--bg); color: var(--ink); }
header { position: sticky; top: 0; background: var(--bg); z-index: 10; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; font-weight: 600; display: inline-block; }
header .actions { float: right; }
header .actions button { margin-left: 8px; }
.search-row { display: flex; gap: 8px; margin-top: 8px; }
input[type=search], input[type=text], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); font-size: 14px; color: var(--ink);
}
button {
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card);
  font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--ink);
}
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: #b03a2e; }
.filters { display: flex; gap: 8px; margin-top: 8px; }
.filters select { flex: 1; }
main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
.note-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
.note-item h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.note-item .meta { font-size: 12px; color: var(--dim); }
.tag { display: inline-block; background: #eceae2; border-radius: 4px; padding: 1px 6px; margin-right: 4px; font-size: 11px; color: #6b6b6b; }
.pager { text-align: center; margin: 16px 0; }
.detail-body { line-height: 1.8; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
.detail-body h1, .detail-body h2, .detail-body h3 { margin: 1em 0 .5em; }
.related-list { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
.related-list a { display: block; padding: 6px 0; color: var(--accent); text-decoration: none; font-size: 14px; }
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
textarea#f-body { min-height: 40vh; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6; }
.tag-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pick .tag { cursor: pointer; padding: 3px 8px; font-size: 12px; }
.tag-pick .tag.on { background: var(--accent); color: #fff; }
.empty { text-align: center; color: var(--dim); padding: 40px 0; font-size: 14px; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2c2c2c; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 99; }
.back-bar { margin-bottom: 12px; }
.total-line { font-size: 12px; color: var(--dim); margin: 4px 0 10px; }
</style>
</head>
<body>
<header>
  <h1>fuxi 知识库</h1>
  <div class="actions">
    <button onclick="showUpload()">上传文件</button>
    <button class="primary" onclick="showForm()">记笔记</button>
  </div>
  <div class="search-row">
    <input type="search" id="q" placeholder="全文搜索…" oninput="debouncedSearch()">
  </div>
  <div class="filters">
    <select id="f-category" onchange="loadList(1)"><option value="">全部分类</option></select>
    <select id="f-tag" onchange="loadList(1)"><option value="">全部标签</option></select>
  </div>
</header>
<main id="app"></main>
<script src="app.js"></script>
</body>
</html>
